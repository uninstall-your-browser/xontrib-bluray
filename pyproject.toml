[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "xontrib-bluray"
version = "2026.10.19"
description = "Upgrade from cd to bluray"
readme.content-type = "text/markdown"
readme.file = "README.md"
authors = [
    { name = "uninstall-your-browser", email = "170106706+uninstall-your-browser@users.noreply.github.com" },
]
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: Terminals",
]
dependencies = [ "xonsh>=0.12.5" ]
urls."Issue tracker" = "https://github.com/uninstall-your-browser/xontrib-bluray/issues"
urls.Code = "https://github.com/uninstall-your-browser/xontrib-bluray"
urls.Documentation = "https://github.com/uninstall-your-browser/xontrib-bluray/blob/master/README.md"
urls.Homepage = "https://github.com/uninstall-your-browser/xontrib-bluray"
entry-points."xonsh.xontribs".bluray = "xontrib_bluray.__main__"

[dependency-groups]
dev = [ "pytest>=7" ]

[tool.hatch]
build.targets.wheel.packages = [ "xontrib_bluray" ]

[tool.uv]

[tool.black]
include = '\.pyi?$'
force-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.vscode
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | disk-cache.sqlite3
)/
'''

[tool.ruff]
lint.select = [
    "B",   # flake8-bugbear
    "E",
    "F",
    "I",   # isort
    "RUF", # ruff specific rules
    "SIM", # simplify
    "TCH", # flake8-type-checking
    "UP",  # pyupgrade
]
lint.ignore = [ "E501" ]


[project]
name = "xontrib-bluray"
version = "2026.10.19"
description = "Upgrade from cd to bluray"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: Terminals",
]
requires-python = ">=3.13"
dependencies = ["xonsh>=0.12.5"]
authors = [
    { name = "uninstall-your-browser", email = "170106706+uninstall-your-browser@users.noreply.github.com" },
]
[project.readme]
file = "README.md"
content-type = "text/markdown"



[project.entry-points."xonsh.xontribs"]
"bluray" = "xontrib_bluray.__main__"



[project.urls]

Homepage = "https://github.com/uninstall-your-browser/xontrib-bluray"
Documentation = "https://github.com/uninstall-your-browser/xontrib-bluray/blob/master/README.md"
Code = "https://github.com/uninstall-your-browser/xontrib-bluray"
"Issue tracker" = "https://github.com/uninstall-your-browser/xontrib-bluray/issues"




[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    
packages = ["xontrib_bluray"]
    


[tool.black]
include = '\.pyi?$'
force-exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.vscode
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | disk-cache.sqlite3
)/
'''

[tool.ruff]
lint.select = [
    "E",
    "F",
    "B", # flake8-bugbear
    "I", # isort
    "UP", # pyupgrade
    "SIM", # simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff specific rules
]
lint.ignore = [
    "E501"
]
